program: experiments/experiment.py
name: &sweep_name avoiding-2D-multimodality-delta-progress-truDI-horizon-sweep
entity: &sweep_entity rubendhanaraju-university-of-porto
project: &sweep_project rlx-multimodality-truDI
notes: &sweep_notes "Change noise schedule of TruDI, entropy target as well and sweep for only some hyperparams."
method: grid

metric:
  name: eval/episode_return
  goal: maximize

parameters:
  algorithm.name:
    values:
      # - reppo.flax_full_jit
      - reppo_dime.flax_full_jit
      # - reppo_pis.flax_full_jit
  algorithm.ent_start:
    values: [1.0, 3.0]
  algorithm.ent_target_mult:
    values: [1.0]
  algorithm.lmbda:
    values: [0.25, 0.5, 0.95]
  algorithm.nr_steps:
    values: [128]

command:
  - conda
  - run
  - -n
  - rlx
  - python
  - -c
  - |
    import json
    import os
    import sys

    program = sys.argv[1]
    args_json_file = sys.argv[2]
    sweep_name = sys.argv[3]
    sweep_entity = sys.argv[4]
    sweep_project = sys.argv[5]
    sweep_notes = sys.argv[6]
    fixed_args = sys.argv[7:]

    with open(args_json_file) as f:
        sweep_args = json.load(f)

    def fmt(value):
        if isinstance(value, float):
            return f"{value:g}"
        return str(value)

    algorithm = sweep_args["algorithm.name"].split(".")[0]
    run_name = (
        f"{algorithm}"
        f"-ent{fmt(sweep_args['algorithm.ent_start'])}"
        f"-target{fmt(sweep_args['algorithm.ent_target_mult'])}"
        f"-lambda{fmt(sweep_args['algorithm.lmbda'])}"
        f"-nr_steps{fmt(sweep_args['algorithm.nr_steps'])}"
    )
    sweep_cli_args = [f"--{key}={value}" for key, value in sweep_args.items()]
    sweep_runner_args = [
        f"--runner.wandb_entity={sweep_entity}",
        f"--runner.project_name={sweep_project}",
        f"--runner.exp_name={sweep_name}",
        f"--runner.notes={sweep_notes}",
    ]
    command = [sys.executable, program, f"--runner.run_name={run_name}", *sweep_runner_args, *fixed_args, *sweep_cli_args]
    os.execv(sys.executable, command)
  - ${program}
  - ${args_json_file}
  - *sweep_name
  - *sweep_entity
  - *sweep_project
  - *sweep_notes
  - --environment.name=custom_jax.avoiding_2d
  - --runner.track_console=False
  - --runner.save_model=True
  - --algorithm.evaluation_and_save_frequency=524288
  - --environment.render=False
  - --runner.track_wandb=True
  - --environment.obstacle_layer_1_enabled=False
  - --environment.obstacle_layer_2_enabled=True
  - --environment.obstacle_layer_3_enabled=True
  - --environment.reward_function=delta_progress
  - --environment.block_on_collision=True
  - --environment.enable_bounds_collision=True
  - --environment.terminate_on_collision=False
  - --environment.terminate_on_goal=False
  - --environment.point_radius=0.0
  - --environment.collision_margin=0.0
  - --algorithm.gamma=1.0
  - --algorithm.v_min=-50
  - --algorithm.v_max=10.0
  - --algorithm.diffusion_init_std=1.0
