# Hamiltonian Bridge Sampler (HBS)
name: hbs
underdamped: True
integrator: OBABO
init_std: 2.5
friction: 1.0
drift: zero # Choose between zero,target,anneal
learn_prior: False
learn_betas: False
learn_friction: True
learn_mass_matrix: False

defaults:
  - score_model: cond_pisgradnet
  - dt_schedule: cosine

