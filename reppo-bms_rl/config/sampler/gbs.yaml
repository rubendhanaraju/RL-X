# General Bridge Sampler (GBS)
name: gbs
underdamped: False
integrator: EM
init_std: 2.5
friction: 1.0
drift: zero # Choose between zero,target,anneal
learn_prior: False
learn_betas: True
learn_friction: True
learn_mass_matrix: False

defaults:
  - score_model: cond_pisgradnet
  - dt_schedule: cosine
