defaults:
  - env: mjx_dmc
  - platform: torch
  - experiment_overrides: default
  - _self_

hyperparameters:
  # env and run settings (mostly don't touch)
  total_time_steps: 52_428_800
  normalize_env: true
  max_episode_steps: 1000
  eval_interval: 2
  num_eval: 400

  # optimization settings (seem very stable)
  lr: 3e-4
  anneal_lr: false
  max_grad_norm: 0.5
  polyak: 1.0 # maybe ablate ?
  use_target_critic_for_actor: False

  # problem discount settings (need tuning)
  gamma: 0.99
  lmbda: 0.95
  lmbda_min: 0.50 # irrelevant if no exploration noise is added

  # batch settings (need tuning for MJX humanoid)
  # buffer_size  = num_steps * num_envs
  # batch_size = num_steps * num_envs / num_minibatches
  num_steps: 128
  num_mini_batches: 128
  num_envs: 1024
  num_subproc: 1
  num_epochs: 4
  batch_repetitions: 1

  Q_score_max_norm: 5.
  Q_score_max_percentile: 95.0
  Q_score_max_norm_for_squashed: False

  num_epochs_actor: 4
  num_epochs_critic: 4

  # exploration settings (currently not touched)
  exploration_noise_max: 1.0
  exploration_noise_min: 1.0
  exploration_base_envs: 0

  # critic architecture settings (need to be increased for MJX humanoid)
  critic_hidden_dim: 512
  actor_hidden_dim: 512 # not used
  vmin: ${env.vmin}
  vmax: ${env.vmax}
  num_bins: 151
  hl_gauss: true
  use_critic_norm: true
  num_critic_encoder_layers: 2
  num_critic_head_layers: 2
  num_critic_pred_layers: 2
  use_simplical_embedding: False
  use_critic_skip: False

  # actor architecture settings (seem stable)
  use_actor_norm: true # not used
  num_actor_layers: 3 # not used
  actor_min_std: 0.0 # not used
  use_actor_skip: False # not used

  # actor & critic loss settings (seem remarkably stable)
  ## kl settings
  kl_start: 1.0 # initial value for learned lagrangian
  kl_bound: 0.1 # switched to tighter bounds for MJX
  reduce_kl: true
  reverse_kl: false # previous default "false"
  kl_action_rep: 1
  update_kl_lagrangian: true
  actor_kl_clip_mode: "clipped" # "full", "clipped", "kl_relu_clipped", "kl_bound_clipped", "value"
  ## entropy settings
  ent_start: 0.01
  entropy_constraint: false
  ent_target_mult: 1.0
  update_entropy_lagrangian: true
  ## auxiliary loss settings
  aux_loss_mult: 1.0

  trust_region_lagrangian: "dual_descent" # #reciprocal_dual_tr_entr", "dual_descent", "optimal_geometric_average", "projection", "dual_optimal_geometric_average"
  trust_region_time_weighting: True # consider time-dependent projection metric weighting, only for "optimal_geometric_average", "projection"
  trust_region_granularity: "avg" # "avg", "state" 

  # logging settings (disable for faster training)
  log_pnorm: true  # log parameter norms (disable to save computation)
  log_gnorm: true  # log gradient norms (disable to save computation)

  # DIME diffusion settings
  diffusion:
    diff_steps: 16
    integrator: "EM"
    loss: am  # Choose between rkl, am

    pis_settings:
      loss_scaling_sigma_power: -1
      scale_loss_with_temperature: True
      smoothed_importance_weighting: False
      onpol_entropy: True

    # TODO: remove
    init_std: 2.5
    friction: 1.0

    learn_forward: true
    learn_backward: false
    learn_prior: false
    learn_betas: false
    learn_friction: true
    learn_mass_matrix: false

    learn_dt: false
    per_step_dt: false
    per_dim_friction: true
    use_step_size_scheduler: false
    dt_schedule:
      _target_: src.networks.reppo_dime.common.torch_schedulers.get_cosine_schedule
      total_steps: ${hyperparameters.diffusion.diff_steps}
      min: 0.001
      s: 0.008
      pow: 2

    # TODO: remove

    score_model:
      use_path_gradient: false
      use_target_score: false
      num_layers: 3
      num_hid: 512
      num_time_hid: 32
      num_time_out: 16
      outer_clip: 1e4
      inner_clip: 1e2
      weight_init: 1e-8
      bias_init: 0.
      layer_norm: true
      layer_norm_type: "LayerNorm"

    noise_schedule:
      _target_: src.networks.reppo_dime.common.torch_scheduler_pis.get_geometric_scheduler
      sigma_max: 2.
      sigma_min: 0.01
    
    # get methods
    sde_integrator: src.networks.reppo_dime.torch_dime_integrators_pis.sde_integrator
    sde_integrator_with_kl: src.networks.reppo_dime.torch_dime_integrators_pis.sde_integrator_with_kl
    ode_integrator: src.networks.reppo_dime.torch_dime_integrators_pis.ode_integrator
    logratio: src.networks.reppo_dime.torch_dime_integrators_pis.logratio

  # Each coefficient will log metrics as: eval/episode_return_ode_XXX where XXX is coef*100
  # ode_coefs: [0.5, 1.0, 2.0]
  # ode_coefs: [1.0]
  ode_coefs: []

  use_staggered_resets: false
  staggered_resets: "uniform_2"  # optional, defaults to "uniform_2"
  num_stagger_blocks: null  # optional

  # action_histogram
  action_histogram_freq: 5000
  action_histogram_samples: 10000
  action_histogram_save_local: false
  action_histogram_verbose: 0

  # render/video parameters
  render_interval: 0  # 0 means no rendering
  render_fps: 30
  render_max_steps: ${env.max_episode_steps}
  render_num_envs: 1  # Number of environments to use for video recording (1-5, 10)
  render_quality: "low"  # "low", "medium", "high", "hd"
  render_camera: "auto"  # "auto" uses camera_configs.py, or specify camera name

  # torchrl
  stochastic_eval: true

measure_burnin: 3

name: "reppo-pis-geomkl-torch"
seed: 0
num_seeds: 1
tune: false
# Video recording parameters (outside hyperparameters for global access)
render_dir: null  # Directory to save ManiSkill videos locally (e.g., "./videos/dime_maniskill")
checkpoint_dir: "./checkpoints"  # Directory to save checkpoints
checkpoint_path: null  # Path to load checkpoint from (for resuming training)
save_checkpoint_interval: 0  # Save checkpoint every N steps (0 = no periodic saving) * eval_interval
save_final_checkpoint: true  # Save checkpoint at the end of training
wandb_upload_checkpoints: true  # Upload checkpoints to wandb as artifacts

# Evaluation-only mode parameters
eval_only: false  # Set to true to run evaluation only (requires checkpoint_path)
eval_episodes: 10  # Number of episodes to run in eval-only mode

save_trajectories: false  # Save end-effector trajectories during evaluation
trajectory_dir: "./trajectories"  # Directory to save trajectory data and plots
plot_trajectories: false  # Generate visualization plots (set to false to only save data)

# Reward surface visualization parameters
reward_surface:
  enabled: false  # Enable reward surface visualization
  interval: 2  # Compute surface every N eval intervals (0 = disabled)
  grid_size: 11  # Grid size for surface (must be odd, e.g., 9, 11, 13)
  save_dir: "./reward_surfaces"  # Directory to save surface plots
  log_wandb: true  # Log surfaces to wandb
  plot_type: "matplotlib"  # "matplotlib" or "plotly"

num_trials: 1
tags: ["experimental"]
wandb:
  mode: "online" # set to online to activate wandb
  entity: "di-skill"
  project: "REPPO_PIS_GEOM_DMC_TORCH"
  group: null

hydra:
  job:
    chdir: True