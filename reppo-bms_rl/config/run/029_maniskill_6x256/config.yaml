# @package _global_
defaults:
  - default # need to set +run=.../config.yaml for correct resolve
  - override /env: maniskill
  - override /experiment_overrides: maniskill
  - _self_

idx: 029
exp_name: maniskill_6x256

hydra:
  run:
    dir: outputs/029_maniskill_6x256/${now:%Y-%m-%d}/${now:%H-%M-%S}

wandb:
  mode: offline
  entity: di-skill
  project: REPPO_PIS_GEOM_MSK
  group: 029_maniskill_6x256

hyperparameters:
  diffusion:
    diff_steps: 16
    noise_schedule:
      sigma_max: 2.0
      sigma_min: 0.01
    score_model:
      num_layers: 6
      num_hid: 256
      layer_norm: true
    pis_settings:
      onpol_entropy: False
      smoothed_importance_weighting: False
      scale_loss_with_temperature: False
  update_entropy_lagrangian: true
  update_kl_lagrangian: true
  ent_start: 0.01
  kl_start: 1.0
  ent_target_mult: 1.0
  num_epochs_actor: 4
  polyak: 1.0
  use_target_critic_for_actor: False
  kl_action_rep: 1
  aux_loss_mult: 1.0

  Q_score_max_percentile: 80.0

  batch_repetitions: 1
  trust_region_lagrangian: dual_optimal_geometric_average
  trust_region_granularity: avg
  trust_region_time_weighting: True
  total_time_steps: 52_428_800
  num_eval: 20
  ode_coefs: [16.0]

experiment_overrides:
  hyperparameters:
    lr: 3e-4
