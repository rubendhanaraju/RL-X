defaults:
  - env: mjx_dmc
  # - platform: torch
  - platform: local
  - diffusion_type: denoising_diffusion
  - experiment_overrides: default
  - _self_

hyperparameters:
  # env and run settings (mostly don't touch)
  total_time_steps: 50_000_000
  normalize_env: true
  max_episode_steps: 1000
  eval_interval: 2
  num_eval: 20

  # optimization settings (seem very stable)
  lr: 3e-4
  anneal_lr: false
  max_grad_norm: 0.5
  polyak: 1.0 # maybe ablate ?
  # polyak: 0.005

  # problem discount settings (need tuning)
  gamma: 0.99
  lmbda: 0.95
  lmbda_min: 0.50 # irrelevant if no exploration noise is added

  # DIME model settings
  diffusion_type: ${diffusion_type}
  use_step_size_scheduler: False

  optimizer:
    lr_critic: 3.0e-4
    lr_actor: 3.0e-4
    b1: 0.5
    do_actor_grad_clip: True
    actor_grad_clip: 1.0


  # batch settings (need tuning for MJX humanoid)
  num_envs: 1024
  batch_size: 1024
  buffer_size: 1024000
  start_learning: 10240
  utd: 2
  policy_frequency: 2
  precollecting_step: 10  

  # CrossQ
  bn_warmup: 100_000
  bn_momentum: 0.99
  critic_net_arch: [512, 512]
  v_min: -200
  v_max: 200
  num_atoms: 101
  critic_entr_coef: 0.005

  # exploration settings (currently not touched)
  exploration_noise_max: 1.0
  exploration_noise_min: 1.0
  exploration_base_envs: 0

  # critic architecture settings (need to be increased for MJX humanoid)
  critic_hidden_dim: 256
  actor_hidden_dim: 256
  vmin: ${env.vmin}
  vmax: ${env.vmax}
  num_bins: 151
  # hl_gauss: true
  hl_gauss: False
  use_critic_norm: True
  num_critic_encoder_layers: 2
  num_critic_head_layers: 2
  num_critic_pred_layers: 2
  use_simplical_embedding: False
  use_critic_skip: False

  # actor architecture settings (seem stable)
  use_actor_norm: True
  num_actor_layers: 3
  actor_min_std: 0.0
  use_actor_skip: False

  # actor & critic loss settings (seem remarkably stable)
  ## kl settings
  logvar_action_rep: 10
  dime_loss: "reverse_kl" # "reverse_kl", "logvar", "moment"
  ## entropy settings
  ent_start: 1.0
  ent_target_mult: 2.3
  update_entropy_lagrangian: true
  ## auxiliary loss settings
  aux_loss_mult: 1.0

measure_burnin: 3

name: "dime"
seed: 0
num_seeds: 1
tune: false
checkpoint_dir: null
# num_trials: 10
num_trials: 1
tags: ["experimental"]
wandb:
  mode: "online" # set to online to activate wandb
  entity: ""
  project: "dime_benchmark"

hydra:
  job:
    chdir: True
