defaults:
  - env: mjx_dmc
  - platform: torch
  - experiment_overrides: default
  - _self_

hyperparameters:
  # env and run settings (mostly don't touch)
  total_time_steps: 30_000_000  #  total environment interactions
  normalize_env: true
  max_episode_steps: 1000  #  Environment episode length
  eval_interval: 2
  num_eval: 20  # Total number of evaluations total_time_steps / num_eval

  # optimization settings (seem very stable)
  lr: 3e-4  # Learning rate for actor AND critic
  anneal_lr: false
  max_grad_norm: 0.5
  polyak: 1.0 # maybe ablate ?

  # problem discount settings (need tuning)
  gamma: 0.99  # discount factor
  lmbda: 0.95  # Parameter for TD lambda
  lmbda_min: 0.50 # irrelevant if no exploration noise is added

  # batch settings (need tuning for MJX humanoid)
  # buffer_size  = num_steps * num_envs
  # batch_size = num_steps * num_envs / num_minibatches
  num_steps: 128
  num_mini_batches: 10
  num_envs: 1024
  num_epochs: 4

  batch_repetitions: 2

  Q_score_max_norm: 5.

  # This is only relevant when splitting learning actor and critic
  num_epochs_actor: 1
  num_epochs_critic: 4

  # exploration settings (currently not touched)
  exploration_noise_max: 1.0
  exploration_noise_min: 1.0
  exploration_base_envs: 0

  # critic architecture settings (need to be increased for MJX humanoid)
  critic_hidden_dim: 512
  actor_hidden_dim: 512 # not used
  vmin: ${env.vmin}
  vmax: ${env.vmax}
  num_bins: 151
  hl_gauss: true
  use_critic_norm: true
  num_critic_encoder_layers: 2
  num_critic_head_layers: 2
  num_critic_pred_layers: 2
  use_simplical_embedding: False
  use_critic_skip: False

  # actor architecture settings (seem stable)
  use_actor_norm: true  # not used
  num_actor_layers: 3  # not used
  actor_min_std: 0.0  # not used
  use_actor_skip: False  # not used

  # actor & critic loss settings (seem remarkably stable)
  ## kl settings
  kl_start: 5  # initial value for  beta
  kl_bound: 0.1 # switched to tighter bounds for MJX
  entr_bound: -1.0
  reduce_kl: true
  reverse_kl: false # previous default "false"
  kl_action_rep: 1
  update_kl_lagrangian: true
  actor_kl_clip_mode: "full" # "full", "clipped", "kl_relu_clipped", "kl_bound_clipped", "value"
  ## entropy settings
  ent_start: 0.01
  ent_target_mult: 4.0
  update_entropy_lagrangian: false
  ## auxiliary loss settings
  aux_loss_mult: 1.0

  # logging settings (disable for faster training)
  log_pnorm: true  # log parameter norms (disable to save computation)
  log_gnorm: true  # log gradient norms (disable to save computation)

  entropy_constraint: true

  # DIME diffusion settings
  diffusion:
    diff_steps: 256
    integrator: "EM"  # this is not used (we use exponential integrator)
    loss: am  # Choose between rkl, am
#    loss: rkl  # Choose between rkl, am

    score_model:
      use_path_gradient: false
      use_target_score: false
      num_layers: 3
      num_hid: 256
      num_time_hid: 32
      num_time_out: 16
      outer_clip: 1e4
      inner_clip: 1e2
      weight_init: 1e-8
      bias_init: 0.
      layer_norm: false
      layer_norm_type: "LayerNorm"

    # NOTE: dt scheduler interface changed for dds: reformat this later
    noise_schedule:
      _target_: src.networks.reppo_dime.common.jax_scheduler_pis.get_geometric_scheduler
      sigma_max: 2.5   # Sets variance of prior in VE
#      sigma_max: 1.0   # Sets variance of prior in VE
      sigma_min: 0.001
#      sigma_min: 0.1

    # get methods
    sde_integrator: src.networks.reppo_dime.jax_dime_integrators_pis.sde_integrator
    sde_integrator_with_kl: src.networks.reppo_dime.jax_dime_integrators_pis.sde_integrator_with_kl
    ode_integrator: src.networks.reppo_dime.jax_dime_integrators_pis.ode_integrator
    logratio: src.networks.reppo_dime.jax_dime_integrators_pis.logratio

  # Each coefficient will log metrics as: eval/episode_return_ode_XXX where XXX is coef*100
  # ode_coefs: [0.5, 1.0, 2.0]
  # ode_coefs: [1.0]
  ode_coefs: []
measure_burnin: 3

name: "TESTNEPOCHS1_SINUS_TR_E_M5_LinDecayH0_0.0_DecRate0.99_LB1e-6"
seed: 0
num_seeds: 1
tune: false
checkpoint_dir: "./checkpoints"  # Directory to save checkpoints
checkpoint_path: null  # Path to load checkpoint from (for resuming training)
save_checkpoint_interval: 0  # Save checkpoint every N steps (0 = no periodic saving)
save_final_checkpoint: false  # Save checkpoint at the end of training
wandb_upload_checkpoints: false  # Upload checkpoints to wandb as artifacts

# Evaluation-only mode parameters
eval_only: false  # Set to true to run evaluation only (requires checkpoint_path)
eval_episodes: 10  # Number of episodes to run in eval-only mode

# Trajectory tracking parameters
save_trajectories: false  # Save end-effector trajectories during evaluation
trajectory_dir: "./trajectories"  # Directory to save trajectory data and plots
plot_trajectories: false  # Generate visualization plots (set to false to only save data)

num_trials: 1
tags: ["experimental", "fixed"]
wandb:
  mode: "online" # set to online to activate wandb
#  mode: "offline" # set to online to activate wandb
  entity: "di-skill"
  project: "TEST_EntropyConstrv2"

hydra:
  job:
    chdir: True
